[versions]
agp = "8.11.2"
androidcontextprovider = "1.0.1"
kotlin = "2.3.20"
media3_version = "1.7.1"
kotlinx-browser = "0.3"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
compose-multiplatform = "1.10.3"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.10.0"
kotlinx-coroutines = "1.10.2"
version-kermit = "2.1.0"
version-koin = "4.2.2"
dokka = "2.2.0"
cyclonedx = "2.2.0"

[libraries]
androidcontextprovider = { module = "io.github.kdroidfilter:androidcontextprovider", version.ref = "androidcontextprovider" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androix-media3-exploplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3_version" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser-wasm-js", version.ref = "kotlinx-browser" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kermit = { module = "co.touchlab:kermit", version.ref = "version-kermit" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "version-koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "version-koin" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "version-koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "version-koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "version-koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "version-koin" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.29.0" }
osdetector = { id = "com.google.osdetector", version = "1.7.3" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
cyclonedx-bom = {id = "org.cyclonedx.bom", version.ref = "cyclonedx"}

[bundles]
koin = [
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-core"
]
